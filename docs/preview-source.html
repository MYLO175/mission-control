const screens={
calendar:{title:'A clear view of your day.',subtitle:'See the appointments that matter, in the same place you think and plan.',nav:'Calendar',html:`<div class="row"><h2>Friday, 23 October</h2><span class="tag">Selected calendars</span></div><div class="muted">A little structure. Enough room to breathe.</div><div class="line"></div><div class="columns"><div><div class="row" style="align-items:start"><span class="time">10:00</span><div class="event" style="flex:1"><strong>Design review</strong><span>10:00–11:00 · Studio</span></div></div><div class="row" style="align-items:start"><span class="time">12:30</span><div class="event" style="flex:1;background:#ece9da;border-color:#b1a16d"><strong>Lunch with Maya</strong><span>12:30–13:30 · Personal</span></div></div><div class="row" style="align-items:start"><span class="time">15:00</span><div class="event" style="flex:1"><strong>Prototype walkthrough</strong><span>15:00–15:30 · Studio</span></div></div></div><div class="card soft"><div class="label">Your afternoon</div><p class="note">Leave some space<br>between the plans.</p><div class="small muted">Read-only is a useful place to start.<br>Editing is a separate choice.</div></div></div>`},
reminders:{title:'Your to-dos, close at hand.',subtitle:'Keep the lists you already use in Apple Reminders, and bring the useful ones into view.',nav:'Reminders',html:`<div class="row"><h2>Things to do</h2><span class="tag">Apple Reminders</span></div><div class="muted">Personal · 4 reminders</div><div class="line"></div><div class="columns"><div class="card"><div class="label">Today</div><div class="task"><span class="check"></span><span>Review the design outline</span><span class="muted" style="margin-left:auto">Today</span></div><div class="task"><span class="check"></span><span>Book a table for Saturday</span></div><div class="task"><span class="check"></span><span>Pick up the parcel</span></div><div class="task"><span class="check done">✓</span><span style="text-decoration:line-through;color:#899384">Water the plants</span></div></div><div class="card soft"><div class="label">Your lists</div><div class="task">Personal <span class="tag" style="margin-left:auto">4</span></div><div class="task">Studio <span class="tag" style="margin-left:auto">7</span></div><div class="task">Someday <span class="tag" style="margin-left:auto">12</span></div></div></div>`},
projects:{title:'Give your longer work a home.',subtitle:'Keep a project, its next steps and the notes behind it together.',nav:'Projects',html:`<div class="row"><h2>Design project</h2><span class="tag">Local workspace</span></div><div class="muted">A place to develop the next prototype.</div><div class="line"></div><div class="three"><div class="boardcol"><div class="label">Next</div><div class="boardcard">Explore material options<div class="muted inset">Research</div></div><div class="boardcard">Plan the walkthrough</div></div><div class="boardcol"><div class="label">In progress</div><div class="boardcard">Write the project outline<div class="progress"><i></i></div></div></div><div class="boardcol"><div class="label">Done</div><div class="boardcard">Gather reference ideas <span class="success">✓</span></div></div></div><div class="card soft inset"><div class="label">Project notes</div><div class="text" style="margin-top:8px">Keep the first version simple. Test the shape before refining the details.</div></div>`},
review:{title:'Good suggestions. Your decision.',subtitle:'A saved inbox for possible next steps, with clear choices and outcomes.',nav:'Review',html:`<div class="row"><h2>A few things to consider</h2><span class="tag">2 suggestions</span></div><div class="muted">Choose the actions that help. Leave the rest.</div><div class="line"></div><div class="card"><div class="row"><strong style="font-size:13px">Prepare for the design walkthrough</strong><span class="muted">Suggested</span></div><p class="text">The next step could be a short project checklist.</p><div class="task"><span class="check"></span><span>Add “Prepare walkthrough notes” to Design project</span></div><div class="row" style="margin-top:12px"><span class="muted">Explore · Dismiss</span><span class="button">Apply selected</span></div></div><div class="card inset"><div class="row"><span style="font-size:12px">Review the open questions in your outline</span><span class="muted">Explore ↗</span></div></div>`},
heartbeat:{title:'A check-in, on your terms.',subtitle:'Choose when your space prepares a fresh brief or looks for something useful.',nav:'Heartbeat',html:`<div class="row"><h2>Background check-ins</h2><div class="toggle"></div></div><div class="muted">An example schedule · nothing runs until you enable it</div><div class="line"></div><div class="columns"><div class="card"><div class="row"><span>Check in every</span><span class="tag">60 minutes</span></div><div class="line"></div><div class="task"><span class="check done">✓</span>Update today's brief</div><div class="task"><span class="check"></span>Prepare Review suggestions</div><div class="task"><span class="check"></span>Consolidate selected context</div><div class="small muted inset">Only selected jobs use your model allowance.</div></div><div class="card soft"><div class="label">A quiet rhythm</div><p class="note">Notify me when<br>something matters.</p><div class="small muted">Respects sleep and your settings.<br>Opening the app isn't an instruction<br>to replay missed work.</div></div></div><div class="row inset"><span class="small muted">Last completed · Today, 10:00</span><span class="small success">Brief updated ✓</span></div>`},
context:{title:'Less repeating yourself.',subtitle:'Keep useful background in pages you can inspect, edit and correct.',nav:'Context',html:`<div class="row"><h2>Context that stays useful</h2><span class="tag">Inspectable pages</span></div><div class="muted">Your routines, ongoing work and the background you choose to retain.</div><div class="line"></div><div class="columns"><div class="card"><div class="label">Working style</div><p class="note">A little clarity.<br>One next step at a time.</p><p class="text">I prefer short suggestions and a flexible afternoon. My design project is the current priority.</p><div class="line"></div><div class="small muted">Edit page · View supporting evidence</div></div><div><div class="card soft"><div class="label">Relevant to this reply</div><div class="task">Everyday overview</div><div class="task">Design project</div><div class="task">Working style</div></div><div class="small muted inset">Saved background is separate from<br>instructions and account permissions.</div></div></div>`},
mail:{title:'Find the messages that matter.',subtitle:'Read selected Mail accounts and prepare local drafts, with your own controls.',nav:'Mail',html:`<div class="row"><h2>Mail at a glance</h2><span class="tag">Read-only</span></div><div class="muted">Fictional Personal account · selected messages</div><div class="line"></div><div class="columns"><div class="card"><div class="mailrow"><div class="row"><strong>Maya Reed</strong><span class="muted">10:12</span></div><p>Design walkthrough — a few thoughts</p></div><div class="mailrow"><div class="row"><strong>Studio team</strong><span class="muted">09:45</span></div><p>Reference ideas for the next prototype</p></div><div class="mailrow"><div class="row"><strong>Community workshop</strong><span class="muted">Yesterday</span></div><p>Your place at Saturday's session</p></div></div><div class="card soft"><div class="label">Local reply draft</div><p class="text">Thanks, Maya. I'll bring a short outline so we can focus on the open questions.</p><div class="pill">Edit</div><div class="pill">Copy draft</div><p class="small muted inset">Sending stays in your Mail app.</p></div></div>`},
whatsapp:{title:'Selected conversations, useful context.',subtitle:'An optional read-only connection for the chats you choose.',nav:'WhatsApp',html:`<div class="row"><h2>Your selected conversations</h2><span class="tag">Read-only helper</span></div><div class="muted">Illustrative linked-device view · fictional chats</div><div class="line"></div><div class="columns"><div class="card"><div class="task"><span class="check done">✓</span>Prototype group</div><div class="task"><span class="check done">✓</span>Weekend plans</div><div class="task"><span class="check"></span>Community workshop</div><div class="small muted inset">You choose which chats may inform<br>the features you've enabled.</div></div><div class="card soft"><div class="label">Prototype group</div><div class="bubble"><strong class="small">Maya</strong><br>Shall we bring the material samples to the walkthrough?</div><div class="small muted">Recent conversation context.<br>No sending or read-receipt commands.</div></div></div><div class="small muted inset">Optional unofficial connector · requires your own linking and consent</div>`},
weather:{title:'A little context for the day outside.',subtitle:'Use a real forecast when it helps your plans, with location and freshness visible.',nav:'Weather',html:`<div class="row"><h2>Weather for your day</h2><span class="tag">Illustrative forecast</span></div><div class="muted">Example location · fictional values</div><div class="line"></div><div class="columns"><div class="card soft"><div class="row"><div class="big">18°</div><div style="font-size:55px;color:#a1ac78">☀</div></div><p class="note">A bright afternoon.</p><div class="muted">Feels like 17° · Light breeze</div><div class="line"></div><div class="row small"><span>12:00 &nbsp; 17°</span><span>15:00 &nbsp; 18°</span><span>18:00 &nbsp; 15°</span></div></div><div class="card"><div class="label">A useful addition</div><p class="text">Keep a walk in mind for the afternoon.</p><div class="line"></div><div class="small muted">Your real app should show the source,<br>location and forecast time.<br><br>Stale or missing data stays labelled.</div></div></div>`},
integrations:{title:'Connect something that helps.',subtitle:'Add a tool for a real workflow, with access chosen deliberately.',nav:'Integrations',html:`<div class="row"><h2>Your tools, your choices</h2><span class="tag">New adapter required</span></div><div class="muted">Illustrative local adapters · not preinstalled integrations</div><div class="line"></div><div class="card"><div class="row"><strong style="font-size:13px">Project tracker</strong><span class="tag">Read-only example</span></div><div class="task"><span class="check done">✓</span>Read selected project summaries</div><div class="task"><span class="check"></span>Create or change issues</div><div class="line"></div><div class="row"><span class="small muted">Connection and tools belong to this app.</span><span class="button">Review connection</span></div></div><div class="two inset"><div class="card soft"><div class="label">Local execution</div><div class="small inset">Typed tools · explicit account access</div></div><div class="card soft"><div class="label">Your provider</div><div class="small inset">Supported tool calls only</div></div></div>`},
widgets:{title:'Arrange a space that feels like yours.',subtitle:'Bring the features you selected together in a dashboard you can shape.',nav:'Dashboard',html:`<div class="row"><h2>Your overview</h2><span class="tag">Example arrangement</span></div><div class="muted">Move, resize and keep the useful things in sight.</div><div class="line"></div><div class="columns"><div class="card"><div class="label">Conversation</div><div class="bubble">What deserves my attention today?</div><div class="text">Start with the project outline. Keep the first pass small enough to finish.</div><div class="bar inset"></div><div class="bar short"></div></div><div><div class="card soft"><div class="label">Today</div><p class="note" style="margin:10px 0">One good thing<br>at a time.</p></div><div class="card inset"><div class="label">Project progress</div><div class="progress"><i></i></div><div class="small muted inset">Outline · In progress</div></div></div></div>`}
};
const id=new URLSearchParams(location.search).get('feature')||'calendar';const data=screens[id];
if(!data){document.getElementById('heading').textContent='Unknown feature';throw new Error('Unknown feature '+id);}
document.title='Mission Control · '+id+' illustration';document.getElementById('heading').textContent=data.title;document.getElementById('subtitle').textContent=data.subtitle;document.getElementById('active-nav').textContent=data.nav;document.getElementById('screen').innerHTML=data.html;
</script></body></html>
